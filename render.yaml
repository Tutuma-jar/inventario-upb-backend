services:
  - type: web
    name: inventario-upb-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:init && npm start
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-upb-db
          property: connectionString
      - key: DB_SSL
        value: false

databases:
  - name: inventario-upb-db
    databaseName: inventario_upb
    user: inventario_upb
    plan: free
